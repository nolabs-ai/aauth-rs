name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.2)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create GitHub Release
    if: github.repository == 'nolabs-ai/aauth-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          generate_release_notes: true

  # Publish in dependency order: aauth-httpsig has no internal deps,
  # aauth-httpsig-policy depends on it, aauth-core depends on both. Each step
  # waits for the previous crate to actually appear in the crates.io index
  # before publishing the next one that depends on it — crates.io rejects a
  # publish whose dependency requirement can't yet be resolved on the
  # registry, even if the path dependency in this checkout is fine.
  #
  # Every crate's version and internal dependency requirements are expected
  # to already agree (enforced by scripts/prepare-release.sh) — this job
  # does not rewrite anything, only publishes what's already committed.
  publish-crates:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    # Only publish stable releases to crates.io
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, 'alpha') && !contains(github.event.inputs.tag || github.ref_name, 'beta') && !contains(github.event.inputs.tag || github.ref_name, 'rc') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Publish aauth-httpsig
        run: |
          VERSION="${RELEASE_TAG#v}"
          if cargo search aauth-httpsig --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "aauth-httpsig $VERSION already published, skipping"
          else
            cargo publish -p aauth-httpsig --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          fi

      - name: Publish aauth-httpsig-policy
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Waiting for aauth-httpsig $VERSION to appear on crates.io..."
          for i in $(seq 1 30); do
            if cargo search aauth-httpsig --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
              echo "Found aauth-httpsig $VERSION on crates.io"
              break
            fi
            echo "Attempt $i: not yet indexed, retrying in 10s..."
            sleep 10
          done
          if cargo search aauth-httpsig-policy --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "aauth-httpsig-policy $VERSION already published, skipping"
          else
            cargo publish -p aauth-httpsig-policy --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          fi

      - name: Publish aauth-core
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "Waiting for aauth-httpsig-policy $VERSION to appear on crates.io..."
          for i in $(seq 1 30); do
            if cargo search aauth-httpsig-policy --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
              echo "Found aauth-httpsig-policy $VERSION on crates.io"
              break
            fi
            echo "Attempt $i: not yet indexed, retrying in 10s..."
            sleep 10
          done
          if cargo search aauth-core --limit 1 2>/dev/null | grep -q "\"$VERSION\""; then
            echo "aauth-core $VERSION already published, skipping"
          else
            cargo publish -p aauth-core --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          fi
